server {
    listen 80;
    server_name pfmweb.ucsd.edu www.pfmweb.ucsd.edu;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pfmweb.ucsd.edu www.pfmweb.ucsd.edu;

    root /var/lib/docker/volumes/pfmweb_pfmweb-public/_data;
    index index.html;

    ssl_certificate /etc/pki/tls/pfmweb_ucsd_edu_fullchain.cer;
    ssl_certificate_key /etc/pki/tls/pfmweb_ucsd_edu.key;

    location / {
        try_files $uri $uri/ =404;
    }
}